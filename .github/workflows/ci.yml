name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Validate OpenClaw plugin
        working-directory: packages/openclaw-tools
        run: |
          pnpm exec openclaw plugins build --entry ./dist/index.js --check
          pnpm exec openclaw plugins validate --entry ./dist/index.js
      - name: Validate OpenClaw hook plugin manifest
        run: node -e "const m=require('./packages/openclaw-hooks/openclaw.plugin.json'); if(m.id!=='plumberr-hooks') process.exit(1)"
