# Local dev infra: Postgres + Redis. `pnpm db:up`
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: plumberr
      POSTGRES_PASSWORD: plumberr
      POSTGRES_DB: plumberr
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plumberr"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  pgdata: {}
